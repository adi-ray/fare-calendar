<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fare Calendar Demo</title>
  <style>
    :root { --bg:#f4f5f7; --card:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#1d4ed8; --accent-ink:#fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#121417; --card:#1b1e22; --ink:#e8e6e3; --muted:#9ca3af; --line:#30353b; --accent:#60a5fa; --accent-ink:#0b1220; }
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    .wrap { max-width:980px; margin:0 auto; padding:24px 16px; }
    h1 { margin:0; font-size:1.5rem; }
    .sub { color:var(--muted); margin:4px 0 16px; }
    .banner { background:#fef3c7; color:#78350f; border-radius:8px; padding:8px 12px; font-size:13px; margin-bottom:16px; }
    @media (prefers-color-scheme: dark) { .banner { background:#3b2f0b; color:#fde68a; } }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:16px; align-items:start; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
    form { display:grid; gap:12px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    label { display:grid; gap:4px; font-size:13px; color:var(--muted); }
    select, input { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 10px; }
    button.go { font:inherit; font-weight:600; border:0; border-radius:8px; padding:11px; background:var(--accent); color:var(--accent-ink); cursor:pointer; }
    .pick { font-size:14px; min-height:1.5em; }
    @media (max-width:760px) { .layout { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Agent flight search</h1>
    <p class="sub">The date picker shows the estimated lowest fare for each date before the agent runs a live search.</p>
    <div class="banner" id="banner" hidden></div>

    <div class="layout">
      <form class="card" id="search">
        <div class="row">
          <label>From <select name="origin" id="origin"></select></label>
          <label>To <select name="destination" id="destination"></select></label>
        </div>
        <label>Departure date <input name="date" id="date" readonly placeholder="Pick a date on the calendar"></label>
        <p class="pick" id="pick"></p>
        <button class="go" type="submit">Search live fares</button>
      </form>

      <fare-calendar id="cal"></fare-calendar>
    </div>
  </div>

  <script src="/widget/fare-calendar.js"></script>
  <script>
    const cal = document.getElementById('cal');
    const o = document.getElementById('origin');
    const d = document.getElementById('destination');

    fetch('/api/health').then((r) => r.json()).then((h) => {
      const b = document.getElementById('banner');
      b.hidden = false;
      b.textContent = /SYNTHETIC/i.test(h.label || '')
        ? `Demo data: fares here are SYNTHETIC search logs, not real prices. Model: ${h.model}.`
        : `Forecast as of ${h.as_of} (${h.model}). Supplier net fares before markup; indicative only.`;
      const pairs = h.routes.map((r) => r.split('-'));
      const uniq = (xs) => [...new Set(xs)].sort();
      o.innerHTML = uniq(pairs.map((p) => p[0])).map((x) => `<option>${x}</option>`).join('');
      const sync = () => {
        d.innerHTML = pairs.filter((p) => p[0] === o.value).map((p) => `<option>${p[1]}</option>`).join('');
        cal.setAttribute('origin', o.value);
        cal.setAttribute('destination', d.value);
      };
      o.addEventListener('change', sync);
      d.addEventListener('change', () => cal.setAttribute('destination', d.value));
      sync();
    });

    cal.addEventListener('fare-select', (e) => {
      const x = e.detail;
      document.getElementById('date').value = x.date;
      const money = (n) => new Intl.NumberFormat(undefined, { style: 'currency', currency: x.currency, maximumFractionDigits: 0 }).format(n);
      document.getElementById('pick').textContent = x.fare == null ? 'No estimate for this date.'
        : x.source === 'seen' ? `Lowest fare seen recently: ${money(x.fare)}`
        : `Estimated lowest fare: ${money(x.fare)} (likely ${money(x.low)}–${money(x.high)})`;
    });

    document.getElementById('search').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('In the real app this hands off to your live supplier search.');
    });
  </script>
</body>
</html>
