name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tag matches package version
        run: |
          pkg=$(python -c "import farecal; print(farecal.__version__)")
          [ "v$pkg" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != package v$pkg"; exit 1; }
      - run: ruff check .
      - run: pytest -q

  release:
    name: GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: pip install build && python -m build
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [$version]" '
            index($0, h) == 1 {grab=1; next}
            grab && index($0, "## [") == 1 {exit}
            grab {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || { echo "::error::no CHANGELOG.md section for $version"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          name: Fare Calendar ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*
            widget/fare-calendar.js

  deploy-production:
    name: Deploy production
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fare-calendar.onrender.com
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
    steps:
      - name: Trigger Render deploy
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" > /dev/null
      - name: Wait for this version to be live
        if: env.HOOK != ''
        run: |
          want="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 60); do
            got=$(curl -fsS https://fare-calendar.onrender.com/api/health | python3 -c "import json,sys; print(json.load(sys.stdin).get('version') or '')" || true)
            [ "$got" = "$want" ] && echo "live: $got" && exit 0
            sleep 10
          done
          echo "::error::production still not on $want after 10 minutes"; exit 1
      - name: Skipped (no deploy hook configured)
        if: env.HOOK == ''
        run: echo "::notice::Add the RENDER_DEPLOY_HOOK_PRODUCTION secret to deploy production on release."
