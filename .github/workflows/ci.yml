name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + dev, without the forecasting models)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  widget:
    name: Widget syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: node --check widget/fare-calendar.js

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t fare-calendar:ci .
      - name: Smoke test
        run: |
          docker run -d --name fc -p 8000:8000 -e FARECAL_ARTIFACT=/app/data/forecasts.SYNTHETIC.json fare-calendar:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          curl -fsS "localhost:8000/api/calendar?origin=DEL&destination=BOM&month=$(date +%Y-%m)" | head -c 200
          docker logs fc

  deploy-demo:
    name: Deploy demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, widget, docker]
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://fare-calendar-demo.onrender.com
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_DEMO }}
    steps:
      - name: Trigger Render deploy
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" > /dev/null
      - name: Wait for this commit to be live
        if: env.HOOK != ''
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 60); do
            got=$(curl -fsS https://fare-calendar-demo.onrender.com/api/health | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit') or '')" || true)
            [ "$got" = "$want" ] && echo "live: $got" && exit 0
            sleep 10
          done
          echo "::error::demo still not on $want after 10 minutes"; exit 1
      - name: Skipped (no deploy hook configured)
        if: env.HOOK == ''
        run: echo "::notice::Add the RENDER_DEPLOY_HOOK_DEMO secret to deploy the demo from CI."
