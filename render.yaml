# Render Blueprint: two services from one repo.
#   fare-calendar-demo  public, SYNTHETIC data committed in the repo, free plan.
#   fare-calendar       private: real forecasts uploaded by the nightly job, behind a login.
# Neither runs PyTorch: forecasts are built where the data lives (scripts/build_artifact.py).
services:
  - type: web
    name: fare-calendar-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn farecal.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FARECAL_ARTIFACT
        value: data/forecasts.SYNTHETIC.json

  - type: web
    name: fare-calendar
    runtime: python
    plan: starter          # always on (no cold starts for agents); covered by the Render credit
    # Uploads from the nightly job (build_artifact.py --upload) land on the disk and survive
    # restarts. The Secret File forecasts.json stays as a fallback; the newer of the two is served.
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn farecal.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: forecasts
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FARECAL_ARTIFACT
        value: /var/data/forecasts.json
      - key: FARECAL_ARTIFACT_SEED
        value: /etc/secrets/forecasts.json
      - key: FARECAL_BASIC_USER
        sync: false        # set in the dashboard
      - key: FARECAL_BASIC_PASS
        sync: false
      - key: FARECAL_API_KEY
        generateValue: true
      - key: FARECAL_ADMIN_TOKEN
        generateValue: true
      - key: FARECAL_CORS_ORIGINS
        sync: false        # your booking portal's origin, e.g. https://portal.example.com
